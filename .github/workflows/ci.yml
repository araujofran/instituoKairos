name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school -d school_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SCHOOL_TEST_DATABASE_URL: postgresql+psycopg://school:test-only@localhost:5432/school_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q
      - run: alembic check
        env:
          SCHOOL_DATABASE_URL: postgresql+psycopg://school:test-only@localhost:5432/school_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
